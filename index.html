<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0E13">
<title>Scope — live object detection</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0B0E13;
    --panel:rgba(16,20,28,.74);
    --edge:rgba(232,228,220,.14);
    --bone:#E8E4DC;
    --dim:#7C8496;
    --signal:#FFB347;
    --stop:#FF6B5A;
    --ar: 3 / 4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:"Archivo",system-ui,-apple-system,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:12px 16px 10px;flex:none;
  }
  .wordmark{display:flex;align-items:baseline;gap:8px}
  .wordmark h1{
    margin:0;font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  }
  .wordmark span{
    font-family:"DM Mono",ui-monospace,monospace;font-size:10px;color:var(--dim);letter-spacing:.08em;
  }
  .readout{
    font-family:"DM Mono",ui-monospace,monospace;font-size:11px;color:var(--dim);
    display:flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
  .dot.live{background:var(--signal);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- viewport ---------- */
  .viewport{
    flex:1;min-height:0;display:grid;place-items:center;padding:0 12px;position:relative;
  }
  .stage{
    position:relative;width:100%;max-height:100%;aspect-ratio:var(--ar);
    border-radius:18px;overflow:hidden;background:#05070A;
    border:1px solid var(--edge);
  }
  video,canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  video{object-fit:cover}
  video.mirror{transform:scaleX(-1)}

  /* corner ticks on the frame itself — the instrument housing */
  .stage::after{
    content:"";position:absolute;inset:10px;pointer-events:none;border-radius:8px;
    background:
      linear-gradient(var(--edge),var(--edge)) left top/16px 1px no-repeat,
      linear-gradient(var(--edge),var(--edge)) left top/1px 16px no-repeat,
      linear-gradient(var(--edge),var(--edge)) right top/16px 1px no-repeat,
      linear-gradient(var(--edge),var(--edge)) right top/1px 16px no-repeat,
      linear-gradient(var(--edge),var(--edge)) left bottom/16px 1px no-repeat,
      linear-gradient(var(--edge),var(--edge)) left bottom/1px 16px no-repeat,
      linear-gradient(var(--edge),var(--edge)) right bottom/16px 1px no-repeat,
      linear-gradient(var(--edge),var(--edge)) right bottom/1px 16px no-repeat;
  }

  /* ---------- cover / start screen ---------- */
  .cover{
    position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;text-align:center;
    padding:28px;background:radial-gradient(120% 90% at 50% 0%,#151B26 0%,#05070A 70%);
  }
  .cover[hidden]{display:none}
  .cover p{
    margin:0;max-width:30ch;color:var(--dim);font-size:14px;line-height:1.5;
  }
  .cover .lede{color:var(--bone);font-size:19px;font-weight:500;line-height:1.35;max-width:22ch}
  .note{
    font-family:"DM Mono",ui-monospace,monospace;font-size:11px;color:var(--dim);
    border-top:1px solid var(--edge);padding-top:12px;max-width:34ch;line-height:1.6;
  }
  .note b{color:var(--signal);font-weight:400}

  /* ---------- controls ---------- */
  .controls{
    flex:none;padding:12px 16px 18px;display:flex;flex-direction:column;gap:12px;
  }
  .roster{
    min-height:30px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .roster::-webkit-scrollbar{display:none}
  .chip{
    font-family:"DM Mono",ui-monospace,monospace;font-size:11px;
    padding:6px 10px;border-radius:999px;white-space:nowrap;flex:none;
    border:1px solid currentColor;background:rgba(255,255,255,.04);
  }
  .chip.empty{color:var(--dim);border-color:var(--edge)}
  .chip b{font-weight:500}

  .row{display:flex;align-items:center;gap:10px}
  button{
    font-family:inherit;font-size:14px;font-weight:500;color:var(--bone);
    background:var(--panel);border:1px solid var(--edge);border-radius:14px;
    padding:14px 16px;cursor:pointer;transition:transform .12s ease,background .2s ease;
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }
  button:active{transform:scale(.97)}
  button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  button[disabled]{opacity:.45;cursor:default}
  .primary{
    flex:1;background:var(--signal);color:#14100A;border-color:transparent;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:16px;
  }
  .primary.is-running{background:transparent;color:var(--stop);border-color:var(--stop)}
  .icon{width:52px;padding:14px 0;flex:none;font-size:17px;line-height:1}

  .slider{
    display:flex;align-items:center;gap:12px;font-family:"DM Mono",ui-monospace,monospace;
    font-size:11px;color:var(--dim);
  }
  .slider label{flex:none;letter-spacing:.06em}
  input[type=range]{
    flex:1;-webkit-appearance:none;appearance:none;height:2px;border-radius:2px;
    background:var(--edge);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
    background:var(--bone);border:4px solid var(--ink);box-shadow:0 0 0 1px var(--edge);
  }
  input[type=range]:focus-visible::-webkit-slider-thumb{background:var(--signal)}
  #thrVal{flex:none;width:34px;text-align:right;color:var(--bone)}

  .error{
    color:var(--stop);font-family:"DM Mono",ui-monospace,monospace;font-size:11.5px;
    line-height:1.6;text-align:center;padding:0 4px;
  }
  .error:empty{display:none}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <h1>Scope</h1>
    <span>COCO-SSD · 80 classes</span>
  </div>
  <div class="readout">
    <span class="dot" id="dot"></span>
    <span id="status">Idle</span>
  </div>
</header>

<div class="viewport">
  <div class="stage" id="stage">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>

    <div class="cover" id="cover">
      <p class="lede">Point the camera at anything. Objects get boxed and named in real time.</p>
      <p>Everything runs on this device — no frames are uploaded.</p>
      <p class="note" id="note">First run downloads a <b>~7 MB</b> model. Keep the tab open while it loads.</p>
    </div>
  </div>
</div>

<div class="controls">
  <div class="roster" id="roster"><span class="chip empty">Nothing detected yet</span></div>
  <div class="row">
    <button class="primary" id="toggle">Start camera</button>
    <button class="icon" id="flip" title="Switch camera" aria-label="Switch camera" disabled>⟲</button>
  </div>
  <div class="slider">
    <label for="thr">MIN CONFIDENCE</label>
    <input type="range" id="thr" min="10" max="90" step="5" value="45">
    <span id="thrVal">45%</span>
  </div>
  <div class="error" id="error"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
(() => {
  "use strict";

  const video   = document.getElementById("video");
  const canvas  = document.getElementById("overlay");
  const ctx     = canvas.getContext("2d");
  const stage   = document.getElementById("stage");
  const cover   = document.getElementById("cover");
  const note    = document.getElementById("note");
  const toggle  = document.getElementById("toggle");
  const flipBtn = document.getElementById("flip");
  const statusEl= document.getElementById("status");
  const dot     = document.getElementById("dot");
  const roster  = document.getElementById("roster");
  const errEl   = document.getElementById("error");
  const thr     = document.getElementById("thr");
  const thrVal  = document.getElementById("thrVal");

  const PALETTE = [
    "#FFB347", "#5AD1E6", "#FF6B5A", "#9BE38A",
    "#C69BFF", "#F2E85C", "#FF9AC4", "#7FA6FF"
  ];
  const colorFor = (label) => {
    let h = 0;
    for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  };

  let model = null;
  let stream = null;
  let running = false;
  let facing = "environment";
  let detections = [];
  let threshold = 0.45;
  let wakeLock = null;
  let fpsSmooth = 0;

  const setStatus = (text, live = false) => {
    statusEl.textContent = text;
    dot.classList.toggle("live", live);
  };
  const setError = (text) => { errEl.textContent = text || ""; };

  /* ---------- camera ---------- */

  async function openCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: facing },
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      }
    });
    video.srcObject = stream;
    video.classList.toggle("mirror", facing === "user");
    await video.play();
    await new Promise(res => {
      if (video.videoWidth) return res();
      video.onloadedmetadata = () => res();
    });
    fitStage();
  }

  function fitStage() {
    const w = video.videoWidth  || 720;
    const h = video.videoHeight || 960;
    stage.style.setProperty("--ar", `${w} / ${h}`);
    canvas.width = w;
    canvas.height = h;
  }

  /* ---------- drawing ---------- */

  function drawFrame() {
    if (!running) return;
    const W = canvas.width, H = canvas.height;
    const S = Math.max(W, H) / 900;          // scale factor for strokes + text
    const mirrored = facing === "user";

    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = "round";
    ctx.textBaseline = "middle";

    for (const d of detections) {
      let [x, y, w, h] = d.bbox;
      if (mirrored) x = W - x - w;

      const color = colorFor(d.class);
      const pad = 3 * S;

      // translucent fill so the subject stays readable
      ctx.fillStyle = color + "1F";
      ctx.fillRect(x, y, w, h);

      // hairline body
      ctx.strokeStyle = color + "88";
      ctx.lineWidth = 1.5 * S;
      ctx.strokeRect(x, y, w, h);

      // signature: heavy corner brackets, like a viewfinder reticle
      const arm = Math.min(w, h) * 0.22 + 6 * S;
      ctx.strokeStyle = color;
      ctx.lineWidth = 4 * S;
      ctx.beginPath();
      ctx.moveTo(x, y + arm);            ctx.lineTo(x, y);            ctx.lineTo(x + arm, y);
      ctx.moveTo(x + w - arm, y);        ctx.lineTo(x + w, y);        ctx.lineTo(x + w, y + arm);
      ctx.moveTo(x + w, y + h - arm);    ctx.lineTo(x + w, y + h);    ctx.lineTo(x + w - arm, y + h);
      ctx.moveTo(x + arm, y + h);        ctx.lineTo(x, y + h);        ctx.lineTo(x, y + h - arm);
      ctx.stroke();

      // label chip
      const pct = Math.round(d.score * 100) + "%";
      const name = d.class.toUpperCase();
      ctx.font = `500 ${13 * S}px "DM Mono", ui-monospace, monospace`;
      const tw = ctx.measureText(name).width;
      const pw = ctx.measureText(pct).width;
      const chipH = 22 * S;
      const chipW = tw + pw + 20 * S;
      let cy = y - chipH - pad;
      if (cy < 0) cy = y + pad;                        // flip inside if clipped
      let cx = Math.min(Math.max(x, 0), W - chipW);

      ctx.fillStyle = color;
      roundRect(cx, cy, chipW, chipH, 4 * S);
      ctx.fill();

      ctx.fillStyle = "#0B0E13";
      ctx.fillText(name, cx + 7 * S, cy + chipH / 2 + 0.5 * S);
      ctx.globalAlpha = 0.6;
      ctx.fillText(pct, cx + chipW - pw - 7 * S, cy + chipH / 2 + 0.5 * S);
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(drawFrame);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------- detection loop ---------- */

  async function detectLoop() {
    while (running) {
      if (document.hidden || video.readyState < 2) {
        await new Promise(r => setTimeout(r, 200));
        continue;
      }
      const t0 = performance.now();
      try {
        const raw = await model.detect(video, 20, 0.2);
        detections = raw.filter(d => d.score >= threshold);
      } catch (e) {
        console.error(e);
        await new Promise(r => setTimeout(r, 300));
      }
      const dt = performance.now() - t0;
      fpsSmooth = fpsSmooth ? fpsSmooth * 0.8 + (1000 / dt) * 0.2 : 1000 / dt;
      setStatus(`${detections.length} found · ${fpsSmooth.toFixed(1)} fps`, true);
      updateRoster();
      await tf.nextFrame();
    }
  }

  function updateRoster() {
    const counts = new Map();
    for (const d of detections) counts.set(d.class, (counts.get(d.class) || 0) + 1);
    if (!counts.size) {
      roster.innerHTML = '<span class="chip empty">Nothing above threshold</span>';
      return;
    }
    roster.innerHTML = [...counts.entries()]
      .sort((a, b) => b[1] - a[1])
      .map(([name, n]) =>
        `<span class="chip" style="color:${colorFor(name)}"><b>${n}</b>&nbsp;${name}</span>`)
      .join("");
  }

  /* ---------- lifecycle ---------- */

  async function start() {
    setError("");
    toggle.disabled = true;

    if (!window.isSecureContext) {
      setError("Camera needs HTTPS. Open this file from an https:// address or localhost.");
      toggle.disabled = false;
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      setError("This browser can't reach the camera. Use Safari or Chrome on iOS.");
      toggle.disabled = false;
      return;
    }

    try {
      setStatus("Requesting camera…");
      await openCamera();

      if (!model) {
        setStatus("Loading model…");
        note.innerHTML = "Downloading model — this takes a few seconds on first run.";
        await tf.ready();
        model = await cocoSsd.load({ base: "lite_mobilenet_v2" });
      }

      running = true;
      cover.hidden = true;
      toggle.textContent = "Stop camera";
      toggle.classList.add("is-running");
      flipBtn.disabled = false;
      toggle.disabled = false;
      requestWakeLock();
      drawFrame();
      detectLoop();
    } catch (err) {
      console.error(err);
      stop();
      toggle.disabled = false;
      setError(explain(err));
      setStatus("Stopped");
    }
  }

  function explain(err) {
    switch (err?.name) {
      case "NotAllowedError":
        return "Camera access was blocked. Tap the “aA” icon in Safari's address bar → Website Settings → Camera → Allow, then try again.";
      case "NotFoundError":
        return "No camera found on this device.";
      case "NotReadableError":
        return "The camera is busy. Close other apps or tabs using it, then try again.";
      default:
        return (err?.message || "Something went wrong.") + " Check your connection — the model loads from a CDN.";
    }
  }

  function stop() {
    running = false;
    detections = [];
    fpsSmooth = 0;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    cover.hidden = false;
    toggle.textContent = "Start camera";
    toggle.classList.remove("is-running");
    flipBtn.disabled = true;
    roster.innerHTML = '<span class="chip empty">Nothing detected yet</span>';
    setStatus("Idle");
    releaseWakeLock();
  }

  async function requestWakeLock() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }
    catch (_) { /* not critical */ }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  /* ---------- events ---------- */

  toggle.addEventListener("click", () => running ? stop() : start());

  flipBtn.addEventListener("click", async () => {
    facing = facing === "environment" ? "user" : "environment";
    flipBtn.disabled = true;
    try { await openCamera(); } catch (e) { setError(explain(e)); }
    flipBtn.disabled = false;
  });

  thr.addEventListener("input", () => {
    threshold = thr.value / 100;
    thrVal.textContent = thr.value + "%";
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && running && !wakeLock) requestWakeLock();
  });

  window.addEventListener("orientationchange", () => setTimeout(fitStage, 400));
  window.addEventListener("pagehide", stop);

  if (!window.isSecureContext) {
    note.innerHTML = "Camera access requires <b>HTTPS</b>. Host this file on an https:// URL or localhost.";
  }
})();
</script>
</body>
</html>
